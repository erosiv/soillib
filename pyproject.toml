[build-system]
requires = ["scikit-build-core >=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "soillib"
dynamic = ["version"]
description = "Numerical Geomorphology Package"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0"
keywords = ["soillib", "erosiv", "geomorphology", "erosion", "simulation", "cuda", "gpu"]
# dependencies = ["silt-erosiv"]

authors = [
  {name = "Nicholas McDonald", email = "nick@erosiv.studio"},
]
maintainers = [
  {name = "Nicholas McDonald", email = "nick@erosiv.studio"},
]

[project.optional-dependencies]
# Building doc/: `pip install -e .[docs]`, then `sphinx-build doc build/html`.
# Doxygen itself is a separate, non-pip binary -- conf.py invokes it
# automatically, so it just needs to be on PATH.
# matplotlib and numpy are not optional for the docs build: autodoc
# imports soillib, whose __init__ imports soillib.util, which imports
# both at module level. Without them the Python API page renders empty.
docs = ["sphinx", "breathe", "myst-parser", "matplotlib", "numpy"]

[project.urls]
Homepage = "https://erosiv.studio"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/erosiv/soillib"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["python/soillib"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>[0-9][^\s]*)'
